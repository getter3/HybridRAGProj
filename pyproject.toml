[project]
name = "hybrid-rag"
version = "0.1.0"
description = "A hands-on hybrid RAG learning project"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-text-splitters>=1.1.3",
    "openai>=3.37.0",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.6",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
